<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Money</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Money">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E1121">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a pocket ledger – one tall column of "slips" on phones, a two-column desk on laptops; money that is yours glows in the accent, money owed carries a red edge. */
:root{
  --bg:#F2F4FA; --surface:#FFFFFF; --raise:#E8EBF6; --ink:#161A36; --muted:#5D6387; --line:#DDE1EF;
  --accent:#3E45D6; --accent-ink:#FFFFFF; --good:#0F8F5A; --bad:#D23B48; --warn:#B7791F;
  --shadow:0 1px 2px rgba(22,26,54,.06),0 8px 24px rgba(22,26,54,.06);
  --display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --body:'Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:18px; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0E1121;--surface:#161A30;--raise:#1F2443;--ink:#ECEEF9;--muted:#9AA0C6;--line:#2A3056;--accent:#F4AE3D;--accent-ink:#1A1300;--good:#3DD68C;--bad:#FF6B72;--warn:#F2C94C;--shadow:0 1px 0 rgba(255,255,255,.03),0 10px 30px rgba(0,0,0,.35);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0E1121;--surface:#161A30;--raise:#1F2443;--ink:#ECEEF9;--muted:#9AA0C6;--line:#2A3056;--accent:#F4AE3D;--accent-ink:#1A1300;--good:#3DD68C;--bad:#FF6B72;--warn:#F2C94C;--shadow:0 1px 0 rgba(255,255,255,.03),0 10px 30px rgba(0,0,0,.35);color-scheme:dark}
/* user-picked skins win over the viewer theme */
.skin-midnight{--bg:#0E1121;--surface:#161A30;--raise:#1F2443;--ink:#ECEEF9;--muted:#9AA0C6;--line:#2A3056;--accent:#F4AE3D;--accent-ink:#1A1300;--good:#3DD68C;--bad:#FF6B72;--warn:#F2C94C;--shadow:0 1px 0 rgba(255,255,255,.03),0 10px 30px rgba(0,0,0,.35);color-scheme:dark}
.skin-paper{--bg:#F2F4FA;--surface:#FFFFFF;--raise:#E8EBF6;--ink:#161A36;--muted:#5D6387;--line:#DDE1EF;--accent:#3E45D6;--accent-ink:#FFFFFF;--good:#0F8F5A;--bad:#D23B48;--warn:#B7791F;--shadow:0 1px 2px rgba(22,26,54,.06),0 8px 24px rgba(22,26,54,.06);color-scheme:light}
.skin-lagoon{--bg:#0A191B;--surface:#10272A;--raise:#173539;--ink:#E6F5F2;--muted:#8DB3AE;--line:#1F4449;--accent:#FF8C69;--accent-ink:#2A0E05;--good:#4BE0A6;--bad:#FF6F7D;--warn:#F5C451;--shadow:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}
.skin-saffron{--bg:#FBF6EE;--surface:#FFFFFF;--raise:#F3EADB;--ink:#2A1F12;--muted:#7A6A55;--line:#EADFCC;--accent:#C2410C;--accent-ink:#FFFFFF;--good:#15803D;--bad:#B91C1C;--warn:#A16207;--shadow:0 8px 24px rgba(42,31,18,.08);color-scheme:light}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
#app{min-height:100%;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* shell */
.shell{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.main{padding:calc(env(safe-area-inset-top) + 14px) max(16px,env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));max-width:1180px;width:100%;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:17px;font-weight:800}
.sub{color:var(--muted);font-size:13px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:11px;font-weight:600;border-radius:12px;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(78px + env(safe-area-inset-bottom));z-index:21;width:58px;height:58px;border-radius:20px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 45%,transparent);display:grid;place-items:center;cursor:pointer}
.fab svg{width:26px;height:26px}
@media (min-width:960px){
  .shell{grid-template-columns:232px 1fr}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface)}
  .side .brand{margin:0 8px 18px}
  .nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:0;background:none;color:var(--muted);font-weight:600;cursor:pointer;text-align:left}
  .nav svg{width:20px;height:20px}
  .nav[aria-current="page"]{background:var(--raise);color:var(--ink)}
  .nav.add{margin-top:10px;background:var(--accent);color:var(--accent-ink);justify-content:center}
  .side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px}
  .tabs,.fab{display:none}
  .main{padding:26px 34px 60px}
  .topbar .brand{display:none}
}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}}
.g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.g4{grid-template-columns:repeat(4,1fr)}}
.sec{margin:22px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{font-size:19px}
.label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,44px);line-height:1.05;letter-spacing:-.02em}
.mid{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em}
.pos{color:var(--good)} .neg{color:var(--bad)} .mut{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--raise);color:var(--muted)}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}

/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--surface)) 0%,var(--surface) 60%)}
.hero .row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px}
.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:16px}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:left}
.acc .n{font-weight:700;display:flex;justify-content:space-between;gap:6px}
.acc .v{font-family:var(--display);font-weight:700;font-size:19px;margin-top:4px}
.bar{height:6px;border-radius:6px;background:var(--raise);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.mini{border-left:4px solid var(--line)}
.mini.owe{border-left-color:var(--bad)} .mini.have{border-left-color:var(--good)} .mini.inv{border-left-color:var(--accent)}

/* month chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* flow */
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.flow .k{font-size:12px;color:var(--muted);font-weight:600}
.flow .v{font-family:var(--display);font-weight:800;font-size:clamp(18px,4.4vw,28px)}
.split{display:flex;height:14px;border-radius:8px;overflow:hidden;background:var(--raise);margin-top:14px}
.split i{display:block;height:100%}

/* groups list */
.glist{display:flex;flex-direction:column;gap:2px}
.gi{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 6px;border-radius:12px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.gi:hover{background:var(--raise)}
.dot{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
.gi .nm{font-weight:600}
.gi .track{height:5px;border-radius:5px;background:var(--raise);margin-top:5px;overflow:hidden}
.gi .track i{display:block;height:100%;border-radius:5px}
.gi .amt{text-align:right;font-weight:700}
.gi .amt small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.subcats{margin:2px 0 8px 44px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.subcats div{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
.subcats b{color:var(--ink);font-weight:600}

/* charts */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .grid line{stroke:var(--line)}
.caption{font-size:13px;color:var(--muted);min-height:20px;margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.donutwrap{display:grid;grid-template-columns:1fr;gap:12px;align-items:center}
@media(min-width:560px){.donutwrap{grid-template-columns:200px 1fr}}

/* insights */
.ins{display:flex;flex-direction:column;gap:8px}
.ins div{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--raise);font-size:14px}
.ins div b{font-weight:700}
.ins .tag{flex:0 0 auto;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--surface);color:var(--muted);margin-top:1px}

/* lists */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.input,.select{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.toolbar .input{flex:1 1 220px}
.toolbar .select{flex:0 1 170px}
.daygrp{margin-top:14px}
.dayh{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:0 4px 6px}
.txl{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tx{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}
.tx:last-child{border-bottom:0}
.tx:hover{background:var(--raise)}
.tx .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .m{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .a{font-weight:700;text-align:right;white-space:nowrap}
.tx .a.in{color:var(--good)} .tx .a.tr{color:var(--muted)}
.sumstrip{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:4px 2px 0}
.sumstrip b{color:var(--ink)}
.more{display:block;margin:14px auto 0;border:1px solid var(--line);background:var(--surface);padding:10px 18px;border-radius:12px;font-weight:600;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rowi{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.rowi:last-child{border-bottom:0}
.rowi:hover{background:var(--raise)}
.rowi .t{font-weight:700}
.rowi .s{font-size:12px;color:var(--muted)}
.rowi .r{text-align:right}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:12px;font-weight:700;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.sm{padding:7px 12px;font-size:13px}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:760px){.menu{grid-template-columns:repeat(3,1fr)}}
.menu button{text-align:left;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.menu b{display:block;font-family:var(--display);font-size:17px}
.menu span{font-size:13px;color:var(--muted)}
.subnav{display:none}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.switch input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--raise);border:1px solid var(--line);position:relative;cursor:pointer;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .2s}
.switch input:checked{background:var(--accent);border-color:var(--accent)}
.switch input:checked::after{transform:translateX(18px);background:var(--accent-ink)}
.banner{padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--warn) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));font-size:13px;margin-bottom:12px}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.skin{border:2px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;text-align:left;background:var(--surface)}
.skin[aria-pressed="true"]{border-color:var(--accent)}
.sw{display:flex;gap:4px;margin-bottom:6px}
.sw i{width:22px;height:22px;border-radius:6px;display:block;border:1px solid rgba(0,0,0,.1)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,7,18,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.3)}
@media(min-width:760px){.scrim{align-items:center}.sheet{border-radius:22px}}
.sheet h3{font-size:20px;margin-bottom:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--raise);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{border:0;background:none;padding:9px;border-radius:9px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.form{display:grid;gap:10px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
.amtin{font-family:var(--display);font-size:28px !important;font-weight:800}
.err{color:var(--bad);font-size:13px;min-height:18px}
.actions{display:flex;gap:10px;justify-content:space-between;margin-top:8px}
.hint{font-size:12px;color:var(--muted)}
.loading{display:grid;place-items:center;min-height:70vh;text-align:center;gap:10px}
.empty{padding:30px;text-align:center;color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{font-size:12px;color:var(--muted);font-weight:700}
.scrollx{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.card,.acc{transition:transform .15s ease}.acc:hover{transform:translateY(-2px)}}
</style>
</head>
<body>
<div id="app"><div class="loading"><div><div class="brand" style="justify-content:center"><span class="mark">₹</span>My Money</div><p class="sub">Opening your ledger…</p></div></div></div>
<div id="sheetroot"></div>
<script>
(function(){
'use strict';
/* ---------------- constants ---------------- */
const GROUP_COLOR={'Living':'#5B8DEF','Food':'#F29E38','Transport':'#8E7CF0','Travel':'#24B9AC','Shopping':'#EC6A99','Lifestyle':'#3FB4F0','Health':'#33C47F','Family & gifts':'#EE8455','Education & career':'#B48CFF','Fees & taxes':'#8D94B3','Other':'#6E7690','Investments':'#D9B43A','Big purchases':'#A8785A','Income':'#33C47F','Savings':'#D9B43A','Transfers':'#8D94B3','Loans':'#E25B66'};
const PAY_E=[['basic','Basic salary','Salary (gross)'],['supp','Supplementary allowance','Salary (gross)'],['hra','House rent allowance','Salary (gross)'],['conv','Conveyance allowance','Salary (gross)'],['saf','SAF – cash option','Salary (gross)'],['lta','LTA payment','Salary (gross)'],['handset','Mobile handset reimbursement','Reimbursement'],['otherE','Other earnings / arrears','Salary (gross)']];
const PAY_D=[['pf','Employee PF','PF (from salary)'],['pfArr','Employee PF arrears','PF (from salary)'],['profTax','Professional tax','Taxes'],['tds','Income tax (TDS)','Taxes'],['tofbs','TOFBS','Welfare schemes (TEFBS/TOFBS)'],['tefbs','TEFBS new scheme','Welfare schemes (TEFBS/TOFBS)'],['canteen','Canteen recovery','Canteen & office food'],['canteen2','Other canteen (TSK / GORC)','Canteen & office food'],['hostel','GT hostel recovery','Rent & hostel'],['otherD','Other deductions','Miscellaneous']];
const INV_TYPES=['Mutual fund','Stock','ETF – index','ETF – gold','ETF – silver','Gold (coin/digital/SGB)','FD','RD','PF','PPF','NPS','LIC / endowment','Other'];
const SKINS=[['auto','Auto','follows your device'],['midnight','Midnight','#0E1121','#F4AE3D','#161A30'],['paper','Paper','#F2F4FA','#3E45D6','#FFFFFF'],['lagoon','Lagoon','#0A191B','#FF8C69','#10272A'],['saffron','Saffron','#FBF6EE','#C2410C','#FFFFFF']];
const ICON={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
 transactions:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',

function catMap(){const m={};(S.settings?S.settings.categories:[]).forEach(c=>m[c.n]=c);return m}
function groupType(){const m={};(S.settings?S.settings.categories:[]).forEach(c=>{m[c.g]=c.t});return m}
function info(c){const m=catMap()[c];return m?{g:m.g,t:m.t}:{g:'Other',t:'Expense'}}
function allTx(){const out=[];Object.keys(S.months).forEach(k=>(S.months[k]||[]).forEach(r=>out.push(r)));out.sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:(a.id<b.id?1:-1));return out}
function monthList(){const s=new Set(Object.keys(S.months).filter(k=>(S.months[k]||[]).length));S.payslips.forEach(p=>s.add(p.m));return [...s].sort()}

function payDed(p){return PAY_D.reduce((a,[k])=>a+(+p[k]||0),0)}
function pfCorpus(){return S.payslips.reduce((a,p)=>a+(+p.pf||0)+(+p.pfArr||0)+(+p.erPf||0),0)}
function investMode(){return S.settings&&S.settings.investMode==='spending'?'spending':'separate'}
function holdingInv(h){return h.pfAuto?pfCorpus():(+h.inv||0)}
function holdingVal(h){return (h.val===null||h.val===undefined||h.val==='')?holdingInv(h):+h.val}

function stats(m){
  const rows=m==='all'?allTx():(S.months[m]||[]).slice();
  const byCat={};
  rows.forEach(r=>{const i=info(r.c);let a;if(i.t==='Income'||i.t==='Loan')a=(+r.i||0)-(+r.o||0);else a=(+r.o||0)-(+r.i||0);byCat[r.c]=(byCat[r.c]||0)+a});
  S.payslips.forEach(p=>{if(m!=='all'&&p.m!==m)return;PAY_E.concat(PAY_D).forEach(([k,,c])=>{const v=+p[k]||0;if(v)byCat[c]=(byCat[c]||0)+v})});
  const cm=catMap();let income=0,spend=0,big=0,saved=0;const byGroup={};
  Object.entries(byCat).forEach(([c,a])=>{const i=cm[c]?{g:cm[c].g,t:cm[c].t}:{g:'Other',t:'Expense'};
    if(i.t==='Income')income+=a;
    else if(i.t==='Expense'){spend+=a;byGroup[i.g]=(byGroup[i.g]||0)+a}
    else if(i.t==='Big purchase')big+=a;
    else if(i.t==='Savings'){saved+=a;if(investMode()==='spending'){spend+=a;byGroup['Investments']=(byGroup['Investments']||0)+a}}});
  const left=income-spend-big-(investMode()==='separate'?saved:0);
  return {rows,byCat,byGroup,income,spend,big,saved,left};
}
function balances(){
  const b={};(S.settings.accounts||[]).forEach(a=>b[a.n]=+a.open||0);
  allTx().forEach(r=>{if(b[r.a]===undefined)b[r.a]=0;b[r.a]+=(+r.i||0)-(+r.o||0);if(r.to){if(b[r.to]===undefined)b[r.to]=0;b[r.to]+=(+r.o||0)}});
  return b;
}
function kindOf(n){const a=(S.settings.accounts||[]).find(x=>x.n===n);return a?a.k:'Bank'}
function loanStatus(){
  const tx=allTx();
  return S.loans.map(l=>{const nm=(l.name||'').toLowerCase();const mine=r=>((r.p||'').toLowerCase()===nm)||(!r.p&&(r.t||'').toLowerCase().includes(nm));
    let a=0,b=0;
    if(l.dir==='borrowed'){tx.forEach(r=>{if(!mine(r))return;if(r.c==='Loan taken')a+=(+r.i||0);if(r.c==='Loan repaid')b+=(+r.o||0)})}
    else{tx.forEach(r=>{if(!mine(r))return;if(r.c==='Lent to someone')a+=(+r.o||0);if(r.c==='Lent money returned')b+=(+r.i||0)})}
    return {...l,amount:a,paid:b,left:a-b}});
}
function money(){
  const b=balances();let cash=0,cards=0;
  (S.settings.accounts||[]).forEach(a=>{const v=b[a.n]||0;if(a.k==='Credit card')cards+=v;else cash+=v});
  const loans=loanStatus();const owe=loans.filter(l=>l.dir==='borrowed').reduce((s,l)=>s+l.left,0);const owed=loans.filter(l=>l.dir==='lent').reduce((s,l)=>s+l.left,0);
  const held=S.invest.filter(h=>h.status!=='Sold');const invInv=held.reduce((s,h)=>s+holdingInv(h),0);const invVal=held.reduce((s,h)=>s+holdingVal(h),0);
  const sep=investMode()==='separate';
  return {b,cash,cardDue:-Math.min(0,cards),cards,owe,owed,invInv,invVal,net:cash+Math.min(0,cards)+(sep?invVal:0)-owe+owed,loans}
}
function subsMonthly(){return S.subs.filter(s=>s.status==='Active').reduce((a,s)=>a+(+s.amt||0)/(s.bill==='Yearly'?12:s.bill==='Quarterly'?3:1),0)}
function backupDue(){const l=S.lastBackup?Date.parse(S.lastBackup):0;return Date.now()-l>14*864e5}

/* ---------------- charts ---------------- */
function donut(parts,total,center,sub){
  const r=70,c=2*Math.PI*r;let off=0;let segs='';
  parts.filter(p=>p.v>0).forEach(p=>{const len=total>0?p.v/total*c:0;segs+=`<circle cx="90" cy="90" r="${r}" fill="none" stroke="${p.col}" stroke-width="26" stroke-dasharray="${Math.max(0,len-1.5)} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"><title>${esc(p.l)}</title></circle>`;off+=len});
  return `<svg viewBox="0 0 180 180" role="img" aria-label="Donut chart of spending by group"><circle cx="90" cy="90" r="${r}" fill="none" stroke="var(--raise)" stroke-width="26"/>${segs}<text x="90" y="86" text-anchor="middle" style="font-family:var(--display);font-weight:800;font-size:19px;fill:var(--ink)">${esc(center)}</text><text x="90" y="106" text-anchor="middle" style="font-size:11px">${esc(sub)}</text></svg>`;
}
function monthlyChart(){
  const ms=monthList();if(!ms.length)return '<p class="empty">No months yet.</p>';
  const data=ms.map(m=>{const s=stats(m);return {m,s}});
  const groups=Object.keys(GROUP_COLOR).filter(g=>data.some(d=>(d.s.byGroup[g]||0)>0));
  const max=Math.max(1,...data.map(d=>Math.max(d.s.income,Object.values(d.s.byGroup).reduce((a,v)=>a+Math.max(0,v),0))));
  const W=640,H=250,L=46,B=26,T=12,iw=W-L-8,ih=H-B-T,bw=Math.min(54,iw/data.length*0.62);
  const step=Math.pow(10,Math.floor(Math.log10(max/4)));const tick=[1,2,2.5,5,10].map(x=>x*step).find(x=>max/x<=5)||step*10;
  let g='';for(let v=0;v<=max*1.001;v+=tick){const y=T+ih-(v/max)*ih;g+=`<line x1="${L}" x2="${W-8}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${v>=100000?(v/100000).toFixed(v%100000?1:0)+'L':v>=1000?(v/1000)+'k':v}</text>`}
  let bars='',pts=[];
  data.forEach((d,i)=>{const cx=L+iw*(i+.5)/data.length;let y=T+ih;
    groups.forEach(gr=>{const v=Math.max(0,d.s.byGroup[gr]||0);if(!v)return;const h=v/max*ih;y-=h;bars+=`<rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${h}" fill="${GROUP_COLOR[gr]}" rx="2"/>`});
    const sel=S.ui.month===d.m;
    bars+=`<rect x="${cx-bw/2-6}" y="${T}" width="${bw+12}" height="${ih}" fill="${sel?'var(--accent)':'transparent'}" opacity="${sel?.08:0}" data-m="${d.m}" style="cursor:pointer"/>`;
    bars+=`<text x="${cx}" y="${H-8}" text-anchor="middle" style="${sel?'fill:var(--ink);font-weight:700':''}">${mShort(d.m)}</text>`;
    if(d.s.income>0)pts.push([cx,T+ih-d.s.income/max*ih,d]);
  });
  const line=pts.length>1?`<polyline points="${pts.map(p=>p[0]+','+p[1]).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="5 4"/>`:'';
  const dots=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>`).join('');
  const leg=groups.map(gr=>`<span><i style="background:${GROUP_COLOR[gr]}"></i>${esc(gr)}</span>`).join('')+`<span><i style="background:transparent;border:2px dashed var(--ink);height:0;width:14px;border-radius:0"></i>Money in</span>`;
  return `<div class="chart" id="mchart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Stacked bars: spending by group each month, dashed line: money in"><g class="grid">${g}</g>${bars}${line}${dots}</svg></div><div class="legend">${leg}</div><div class="caption" id="mcap">Tap a month to see it.</div>`;
}

function insights(m,st,prev,n){
  const out=[];const exp=st.rows.filter(r=>{const t=info(r.c).t;return (t==='Expense')&&(+r.o||0)>0}).sort((a,b)=>b.o-a.o);
  const groups=Object.entries(st.byGroup).sort((a,b)=>b[1]-a[1]);
  if(st.income>0)out.push(['RATE',`You spent <b>${pct(st.spend/st.income)}</b> of the money that came in${m==='all'?' since joining':' during '+esc(mLabel(m))}.`]);
  if(groups[0])out.push(['TOP',`<b>${esc(groups[0][0])}</b> took the most: <b class="num">${R(groups[0][1])}</b> (${pct(st.spend?groups[0][1]/st.spend:0)} of spending).`]);
  if(prev){const ch=Object.keys({...st.byGroup,...prev.byGroup}).map(g=>[g,(st.byGroup[g]||0)-(prev.byGroup[g]||0)]).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]))[0];
    if(ch&&Math.abs(ch[1])>1)out.push(['MOVE',`<b>${esc(ch[0])}</b> is ${ch[1]>0?'up':'down'} <b class="num">${R(Math.abs(ch[1]))}</b> on last month.`]);
    const d=st.spend-prev.spend;out.push(['TOTAL',`Total spending is ${d>0?'up':'down'} <b class="num">${R(Math.abs(d))}</b> on last month.`])}
  else if(m==='all')out.push(['AVG',`On average you spend <b class="num">${R(st.spend/n)}</b> a month (${n} months, June counts from the 15th).`]);
  if(exp[0])out.push(['BIG',`Largest single spend: <b>${esc(exp[0].t)}</b> – <b class="num">${R(exp[0].o)}</b> on ${dLabel(exp[0].d)}.`]);
  const sm=subsMonthly();if(sm)out.push(['SUBS',`Subscriptions cost <b class="num">${R(sm)}</b> a month (${R(sm*12)} a year).`]);
  return out.map(([t,h])=>`<div><span class="tag">${t}</span><span>${h}</span></div>`).join('');
}

  window.scrollTo(0,scroll);

  const rs=$('#reset');if(rs)rs.onclick=()=>{if(!rs.classList.contains('armed')){rs.classList.add('armed');rs.textContent='Tap again – this deletes all data here';setTimeout(()=>{rs.classList.remove('armed');rs.textContent='Erase everything on this device'},4000);return}try{localStorage.removeItem(KEY)}catch(e){}Object.assign(S,{settings:null,months:{},payslips:[],invest:[],subs:[],loans:[],empty:true});render()};

function toCSV(){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';return 'Date,Account,Description,Category,Group,Type,Out,In,To account,Person,Note\n'+allTx().slice().reverse().map(r=>{const i=info(r.c);return [r.d,r.a,r.t,r.c,i.g,i.t,r.o||'',r.i||'',r.to||'',r.p||'',r.n||''].map(q).join(',')}).join('\n')}
function backupJSON(){return JSON.stringify({v:1,exported:new Date().toISOString(),settings:S.settings,months:S.months,payslips:S.payslips,invest:S.invest,subs:S.subs,loans:S.loans})}
async function exportFile(name,data,type){
  const blob=new Blob([data],{type});
  try{const file=new File([blob],name,{type});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});markBackup(name);return}}catch(e){if(e&&e.name==='AbortError')return}
  try{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);markBackup(name)}
  catch(e){try{await navigator.clipboard.writeText(data);toast('Copied to your clipboard instead.')}catch(e2){toast('This browser blocked the download.')}}
}
function markBackup(name){if(/backup/.test(name)){S.lastBackup=new Date().toISOString();persist();toast('Backup made. Keep it in Files / iCloud Drive.')}}

   <div class="label" style="margin-top:6px">Earnings</div><div class="two">${PAY_E.map(([k,l])=>num(k,l)).join('')}</div>
   <div class="label" style="margin-top:6px">Deductions</div><div class="two">${PAY_D.map(([k,l])=>num(k,l)).join('')}</div>
   <div class="two">${fld('p_net','Net pay printed on payslip',inp('p_net',p.net,'number','step="0.01"'))}${fld('p_erPf','Employer PF this month',inp('p_erPf',p.erPf,'number','step="0.01"'))}</div>
   <p class="hint" id="pcalc"></p>`;
  sheet(ed?'Payslip – '+mLabel(p.m):'Add payslip',html,fd=>{
    const m=ed?p.m:fd.get('pm');if(!/^\d{4}-\d{2}$/.test(m||''))return 'Pick the pay month.';
    if(!ed&&S.payslips.some(x=>x.m===m))return 'That month already has a payslip – open it to edit.';
    const o={m};PAY_E.concat(PAY_D).forEach(([k])=>o[k]=round2(fd.get('p_'+k)));o.net=fd.get('p_net')===''?null:round2(fd.get('p_net'));o.erPf=round2(fd.get('p_erPf'));
    const calc=round2(payGross(o)-payDed(o));if(o.net!==null&&Math.abs(calc-o.net)>=0.005)return `Gross − deductions = ${R2(calc)}, but the payslip says ${R2(o.net)}. Check for a typo.`;
    if(ed)S.payslips=S.payslips.map(x=>x.m===m?o:x);else S.payslips.push(o);saveList('payslips');toast('Payslip saved.');
  },ed?()=>{S.payslips=S.payslips.filter(x=>x.m!==p.m);saveList('payslips')}:null,()=>{
    const f=$('#frm');const up=()=>{const fd=new FormData(f);const g=PAY_E.reduce((a,[k])=>a+(+fd.get('p_'+k)||0),0),d=PAY_D.reduce((a,[k])=>a+(+fd.get('p_'+k)||0),0);$('#pcalc').textContent=`Gross ${R2(g)} − deductions ${R2(d)} = net ${R2(g-d)}`};f.addEventListener('input',up);up()});
}
function subForm(s){
  const ed=!!s;s=s||{name:'',match:'',amt:'',bill:'Monthly',from:'Canara',status:'Active',next:'',note:''};
  const html=`${fld('sn','Name',inp('sn',s.name))}<div class="two">${fld('sa','Amount (₹)',inp('sa',s.amt,'number','step="0.01"'))}${fld('sb','Billed',sel('sb',['Monthly','Quarterly','Yearly'],s.bill))}</div>
   <div class="two">${fld('sf','Paid from',sel('sf',(S.settings.accounts||[]).map(a=>a.n),s.from))}${fld('ss','Status',sel('ss',['Active','Cancelled'],s.status))}</div>
   <div class="two">${fld('sx','Next renewal',inp('sx',s.next,'date'))}${fld('sm','Match text',inp('sm',s.match,'text','placeholder="word in its transactions"'))}</div>${fld('sno','Note',inp('sno',s.note))}
   <p class="hint">"Match text" finds its payments in Transactions to show how much you have paid so far.</p>`;
  sheet(ed?'Edit subscription':'Add subscription',html,fd=>{const name=(fd.get('sn')||'').trim();if(!name)return 'Give it a name.';const amt=round2(fd.get('sa'));if(!(amt>0))return 'Enter the amount.';
    const o={...s,id:s.id||uid(),name,amt,bill:fd.get('sb'),from:fd.get('sf'),status:fd.get('ss'),next:fd.get('sx'),match:(fd.get('sm')||'').trim()||name,note:fd.get('sno')};
    if(ed)S.subs=S.subs.map(x=>x.id===s.id?o:x);else S.subs.push(o);saveList('subs');toast('Saved.')},ed?()=>{S.subs=S.subs.filter(x=>x.id!==s.id);saveList('subs')}:null);
}
function loanForm(l){
  const ed=!!l;l=l||{name:'',dir:'borrowed',note:''};
  const html=`${fld('ln','Person',inp('ln',l.name))}${fld('ld','Direction',sel('ld',[['borrowed','I borrowed from them'],['lent','I lent to them']],l.dir))}${fld('lno','Note',inp('lno',l.note))}
   <p class="hint">Then log the money itself as a transaction: category "Loan taken" (or "Lent to someone") with this name as the person.</p>`;
  sheet(ed?'Edit loan':'Add person',html,fd=>{const name=(fd.get('ln')||'').trim();if(!name)return 'Give a name.';const o={...l,id:l.id||uid(),name,dir:fd.get('ld'),note:fd.get('lno')};
    if(ed)S.loans=S.loans.map(x=>x.id===l.id?o:x);else S.loans.push(o);saveList('loans');toast('Saved.')},ed?()=>{S.loans=S.loans.filter(x=>x.id!==l.id);saveList('loans')}:null);
}
function catForm(c){
  const ed=!!c;c=c||{n:'',g:'Other',t:'Expense',b:0};const gs=[...new Set(S.settings.categories.map(x=>x.g))];const used=ed&&allTx().some(r=>r.c===c.n);
  const html=`${fld('cn','Name',inp('cn',c.n))}<div class="two">${fld('cg','Group',sel('cg',gs,c.g))}${fld('cb','Monthly budget (₹, optional)',inp('cb',c.b||'','number','step="1"'))}</div><p class="hint">The group decides how it counts (spending, income, savings, transfer or loan).</p>`;
  sheet(ed?'Edit category':'Add category',html,fd=>{
    const n=(fd.get('cn')||'').trim();if(!n)return 'Give it a name.';if(n!==c.n&&S.settings.categories.some(x=>x.n===n))return 'That category already exists.';
    const g=fd.get('cg');const t=groupType()[g]||'Expense';const o={n,g,t,b:+fd.get('cb')||0};
    if(ed){S.settings.categories=S.settings.categories.map(x=>x.n===c.n?o:x);
      if(n!==c.n){Object.keys(S.months).forEach(m=>{let ch=false;S.months[m]=S.months[m].map(r=>r.c===c.n?(ch=true,{...r,c:n}):r);if(ch)saveMonth(m)})}}
    else S.settings.categories.push(o);
    saveSettings();toast('Saved.')},ed&&!used?()=>{S.settings.categories=S.settings.categories.filter(x=>x.n!==c.n);saveSettings()}:null);
}

/* ---------------- start ---------------- */
const h=(location.hash||'').slice(1);if(['home','transactions','invest','more','accounts','payslips','subscriptions','loans','categories','prefs'].includes(h))S.ui.view=h;
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v&&v!==S.ui.view&&['home','transactions','invest','more','accounts','payslips','subscriptions','loans','categories','prefs'].includes(v)){S.ui.view=v;render()}});
boot();
})();
</script>
</body>
</html>
